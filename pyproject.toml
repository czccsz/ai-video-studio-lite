[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-studio-lite"
version = "0.1.0"
description = "AI-assisted Chinese short video maker: storyboard, narration, captions and MP4 export"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Pillow>=10.4,<13", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
voice = ["edge-tts>=7,<8"]

[project.scripts]
aivideo = "aivideo.__main__:main"

[tool.setuptools.packages.find]
include = ["aivideo*"]
